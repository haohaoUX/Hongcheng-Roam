<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>南昌旅游路线规划 · 风格预览</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230A84FF'/><circle cx='32' cy='27' r='11' fill='white'/><path d='M32 43 L23 55 L41 55 Z' fill='white'/></svg>">
<style>
/* ========== 设计 Token ========== */
:root{
  --bg:#f5f5f7;
  --text:#1d1d1f;
  --text-2:#6e6e73;
  --text-3:#aeaeb2;
  --accent:#0a84ff;
  --accent-soft:rgba(10,132,255,.14);
  --c-spot:#0a84ff; --c-food:#ff9500; --c-leisure:#34c759; --c-facility:#8e8e93;
  --danger:#ff3b30;
  --glass-bg:rgba(255,255,255,.62);
  --glass-bg-strong:rgba(255,255,255,.78);
  --glass-inner:rgba(255,255,255,.55);
  --glass-border:rgba(255,255,255,.65);
  --glass-edge:rgba(0,0,0,.06);
  --card-bg:rgba(255,255,255,.7);
  --line:rgba(0,0,0,.07);
  --shadow-s:0 2px 8px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04);
  --shadow-m:0 8px 24px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.04);
  --shadow-l:0 24px 60px rgba(0,0,0,.14),0 8px 20px rgba(0,0,0,.08);
  --blur:blur(24px) saturate(1.8);
  --map-bg:#e9ede6; --map-water:#a9c9e2; --map-water-2:#c3dcef; --map-green:#c9dfbf;
  --map-road:#fbfcf9; --map-road-2:#d9ded5; --map-block:#e3e6df; --map-boundary:rgba(90,110,90,.28);
  --r-xl:24px; --r-l:20px; --r-m:14px; --r-s:10px;
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.3,.64,1);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",sans-serif;
}
[data-theme="dark"]{
  --bg:#000; --text:#f5f5f7; --text-2:#98989d; --text-3:#636366;
  --accent:#409cff; --accent-soft:rgba(64,156,255,.2);
  --glass-bg:rgba(28,28,30,.62); --glass-bg-strong:rgba(36,36,38,.82);
  --glass-inner:rgba(255,255,255,.06); --glass-border:rgba(255,255,255,.1);
  --glass-edge:rgba(255,255,255,.08); --card-bg:rgba(255,255,255,.05); --line:rgba(255,255,255,.09);
  --shadow-s:0 2px 8px rgba(0,0,0,.4); --shadow-m:0 8px 24px rgba(0,0,0,.5);
  --shadow-l:0 24px 60px rgba(0,0,0,.6);
  --map-bg:#1c1f1d; --map-water:#27435c; --map-water-2:#31546f; --map-green:#263527;
  --map-road:#2e322f; --map-road-2:#262a27; --map-block:#242824; --map-boundary:rgba(180,200,180,.18);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);overflow:hidden;font-variant-numeric:tabular-nums}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input{font-family:inherit}

/* ========== 应用骨架 ========== */
.app{position:relative;height:100dvh;overflow:hidden}
.view{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.view.active{opacity:1;pointer-events:auto}

/* ========== 地图舞台 ========== */
.map-stage{position:absolute;inset:0;background:var(--map-bg)}
.map-svg{position:absolute;inset:0;width:100%;height:100%}
.map-svg .road{fill:none;stroke:var(--map-road);stroke-linecap:round}
.map-svg .road2{fill:none;stroke:var(--map-road-2);stroke-linecap:round}
.map-svg .block{fill:var(--map-block)}
.map-svg .green{fill:var(--map-green)}
.map-svg .water{fill:var(--map-water)}
.map-svg .river{fill:none;stroke:var(--map-water);stroke-linecap:round}
.map-svg .river2{fill:none;stroke:var(--map-water-2);stroke-linecap:round}
.map-svg .boundary{fill:none;stroke:var(--map-boundary);stroke-dasharray:6 8}
.markers-layer{position:absolute;inset:0}

/* ========== Marker ========== */
.marker{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%);display:grid;place-items:center;transition:opacity .25s var(--ease)}
.marker .pin{width:26px;height:26px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);display:grid;place-items:center;transition:transform .2s var(--spring);background:var(--pin-color)}
.marker .pin svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.marker:hover .pin{transform:scale(1.18)}
.marker.facility{width:22px;height:22px}
.marker.facility .pin{width:18px;height:18px;border-width:2px}
.marker.visited .pin{opacity:.35}
.marker.hidden-marker{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.5)}
.marker.flash .pin{animation:pinFlash 1.1s var(--spring)}
@keyframes pinFlash{0%{box-shadow:0 0 0 0 rgba(10,132,255,.5)}100%{box-shadow:0 0 0 18px rgba(10,132,255,0)}}
.marker.tip-label::before{content:attr(data-name);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--glass-bg-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);font-size:12px;font-weight:500;padding:5px 10px;border-radius:8px;box-shadow:var(--shadow-s);border:1px solid var(--glass-border)}

/* ========== 通用玻璃 ========== */
.glass{background:var(--glass-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);box-shadow:var(--shadow-m)}
@supports not (backdrop-filter:blur(1px)){.glass,.bottom-nav,.search-bar,.toast{background:var(--glass-bg-strong)}}

/* ========== 搜索栏 ========== */
.search-bar{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:min(420px,calc(100vw - 200px));height:42px;border-radius:21px;display:flex;align-items:center;gap:8px;padding:0 16px;z-index:30}
.search-bar svg{width:17px;height:17px;stroke:var(--text-2);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.search-bar input{flex:1;min-width:0;border:none;background:none;outline:none;font-size:14px;color:var(--text)}
.search-bar input::placeholder{color:var(--text-3)}
.search-bar:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow-m)}

/* ========== 左侧侧边栏 ========== */
.sidebar{position:absolute;left:16px;top:72px;bottom:96px;width:236px;z-index:20;display:flex;flex-direction:column;gap:10px}
.sb-buttons{display:flex;gap:8px}
.sb-btn{flex:1;height:46px;border-radius:var(--r-m);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:var(--text-2);background:var(--glass-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);box-shadow:var(--shadow-s);transition:all .2s var(--ease)}
.sb-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb-btn:active{transform:scale(.96)}
.sb-btn.on{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(10,132,255,.35)}

/* ========== 筛选面板 ========== */
.filter-panel{border-radius:var(--r-l);padding:14px;display:none;transform-origin:top left;animation:pop .28s var(--spring)}
.filter-panel.open{display:block}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.filter-group-title{font-size:11px;font-weight:600;color:var(--text-3);margin:4px 2px 8px;letter-spacing:.5px}
.filter-group{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.filter-group:last-child{margin-bottom:2px}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);padding:6px 10px 6px 7px;border-radius:18px;background:var(--glass-inner);border:1px solid transparent;cursor:pointer;transition:all .18s var(--ease);min-height:32px}
.chk .box{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--text-3);display:grid;place-items:center;transition:all .18s var(--ease);flex:none}
.chk .box svg{width:10px;height:10px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.on{color:var(--accent);border-color:var(--accent)}
.chk.on .box{background:var(--accent);border-color:var(--accent)}
.chk.on .box svg{opacity:1}

/* ========== 待选清单 ========== */
.selected-panel{flex:1;min-height:0;border-radius:var(--r-l);display:flex;flex-direction:column;overflow:hidden}
.sp-head{padding:13px 14px 10px;display:flex;align-items:center;justify-content:space-between;flex:none}
.sp-title{font-size:14px;font-weight:600}
.sp-count{font-size:12px;color:var(--text-2);background:var(--glass-inner);padding:3px 9px;border-radius:11px}
.sp-tools{display:flex;gap:6px;padding:0 12px 10px;flex:none}
.mini-chip{font-size:11.5px;color:var(--text-2);padding:4px 10px;border-radius:12px;background:var(--glass-inner);transition:all .15s var(--ease)}
.mini-chip.on{background:var(--accent-soft);color:var(--accent)}
.sp-list{flex:1;min-height:0;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:7px}
.sp-list::-webkit-scrollbar{width:4px}
.sp-list::-webkit-scrollbar-thumb{background:var(--text-3);border-radius:2px}
.sp-item{border-radius:var(--r-m);background:var(--glass-inner);padding:9px 10px;display:flex;align-items:center;gap:9px;transition:transform .18s var(--ease),box-shadow .18s var(--ease);cursor:pointer}
.sp-item:hover{transform:translateY(-1px);box-shadow:var(--shadow-s)}
.sp-item .dot{width:9px;height:9px;border-radius:50%;flex:none}
.sp-item .meta{flex:1;min-width:0}
.sp-item .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-item .ty{font-size:11px;color:var(--text-2);margin-top:1px}
.sp-item .note-ico{width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:2;flex:none}
.sp-item .del{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none}
.sp-item .del svg{width:13px;height:13px;stroke:var(--text-2);fill:none;stroke-width:2;stroke-linecap:round}
.sp-item .del:hover{background:rgba(255,59,48,.12)}
.sp-item .del:hover svg{stroke:var(--danger)}
.sp-item.dragging{box-shadow:var(--shadow-m);opacity:.85}
.sp-empty{text-align:center;color:var(--text-3);font-size:12.5px;padding:34px 10px;line-height:1.8}
.sp-foot{padding:10px 12px 12px;flex:none}
.text-btn{font-size:12px;color:var(--danger);width:100%;padding:7px;border-radius:10px;background:var(--glass-inner);transition:all .15s}
.text-btn:active{transform:scale(.97)}

/* ========== 复位 & 主题按钮 ========== */
.fab{position:absolute;right:18px;z-index:15;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;box-shadow:var(--shadow-m)}
.fab svg{width:19px;height:19px;stroke:var(--text-2);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fab:active{transform:scale(.94)}
.reset-btn{bottom:108px}
.theme-btn{top:16px;z-index:25}
.theme-btn svg{stroke:var(--text-2)}

/* ========== 点位详情卡片 ========== */
.detail-card{position:absolute;right:22px;top:50%;width:330px;transform:translateY(-46%);border-radius:var(--r-xl);z-index:22;opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease);max-height:calc(100% - 180px);display:flex;flex-direction:column;overflow:hidden}
.detail-card.open{opacity:1;pointer-events:auto;transform:translateY(-50%)}
.dc-body{padding:18px;overflow-y:auto}
.dc-body::-webkit-scrollbar{width:4px}
.dc-body::-webkit-scrollbar-thumb{background:var(--text-3);border-radius:2px}
.dc-name{font-size:18px;font-weight:600}
.dc-sub{font-size:12px;color:var(--text-2);margin-top:4px;display:flex;align-items:center;gap:6px}
.dc-sub .tag{color:var(--accent)}
.dc-desc{font-size:13.5px;line-height:1.65;color:var(--text);margin-top:12px}
.dc-info{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.dc-row{display:flex;align-items:center;gap:9px;font-size:13px}
.dc-row svg{width:16px;height:16px;stroke:var(--text-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dc-row .k{color:var(--text-2);width:58px;flex:none}
.dc-row .v{color:var(--text)}
.dc-note{margin-top:14px}
.dc-note textarea{width:100%;height:54px;border-radius:var(--r-m);background:var(--glass-inner);border:1px solid transparent;padding:9px 11px;font-size:13px;color:var(--text);resize:none;outline:none;transition:border .15s}
.dc-note textarea:focus{border-color:var(--accent)}
.dc-actions{display:flex;gap:8px;padding:12px 18px 16px}
.btn{flex:1;height:42px;border-radius:14px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s var(--ease),background .2s}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:disabled{background:var(--text-3);cursor:default}
.btn-ghost{background:var(--glass-inner);color:var(--text)}
.btn-ghost:active{transform:scale(.97)}

/* ========== 规划页 ========== */
.plan-wrap{position:absolute;inset:0;padding:74px 24px 108px;overflow-y:auto}
.plan-wrap::-webkit-scrollbar{width:5px}
.plan-wrap::-webkit-scrollbar-thumb{background:var(--text-3);border-radius:3px}
.plan-title{font-size:26px;font-weight:700;letter-spacing:-.3px}
.plan-grid{display:grid;grid-template-columns:340px 1fr;gap:18px;margin-top:18px;align-items:start}
.plan-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.plan-card{border-radius:var(--r-l);padding:16px}
.pc-card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.seg{display:flex;background:var(--glass-inner);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;height:32px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--text-2);transition:all .2s var(--ease)}
.seg button.on{background:var(--glass-bg-strong);color:var(--text);box-shadow:var(--shadow-s)}
.plan-list{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto}
.plan-list::-webkit-scrollbar{width:4px}
.plan-list::-webkit-scrollbar-thumb{background:var(--text-3);border-radius:2px}
.generate-btn{width:100%;height:46px;border-radius:14px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(10,132,255,.3);transition:transform .15s var(--ease)}
.generate-btn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.generate-btn:active{transform:scale(.98)}
.route-cards{display:flex;flex-direction:column;gap:12px}

/* ========== 路线卡片 ========== */
.route-card{border-radius:var(--r-l);overflow:hidden;transition:box-shadow .2s}
.route-card:hover{box-shadow:var(--shadow-m)}
.rc-head{padding:15px 16px;display:flex;align-items:center;gap:11px;cursor:pointer;min-height:56px}
.rc-order{width:30px;height:30px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;display:grid;place-items:center;flex:none}
.rc-meta{flex:1;min-width:0}
.rc-name{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.rc-name input{background:none;border:none;outline:none;font-size:14.5px;font-weight:600;color:var(--text);width:130px;min-width:0;border-radius:6px;padding:1px 4px}
.rc-name input:focus{background:var(--glass-inner)}
.rc-count{font-size:12px;color:var(--text-2);margin-top:2px}
.rc-icon-btn{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.rc-icon-btn svg{width:15px;height:15px;stroke:var(--text-2);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rc-icon-btn:hover{background:var(--glass-inner)}
.rc-chevron{transition:transform .25s var(--ease)}
.route-card.open .rc-chevron{transform:rotate(180deg)}
.rc-body{display:none;padding:0 16px 16px}
.route-card.open .rc-body{display:block;animation:fadeSlide .3s var(--ease)}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.rc-summary{display:flex;gap:8px;margin-bottom:12px}
.rc-summary .chip{font-size:12px;color:var(--text-2);background:var(--glass-inner);padding:5px 11px;border-radius:11px;display:flex;align-items:center;gap:5px}
.rc-summary .chip svg{width:13px;height:13px;stroke:var(--text-2);fill:none;stroke-width:1.9}
.mini-map{height:180px;border-radius:var(--r-m);overflow:hidden;position:relative;background:var(--map-bg);margin-bottom:12px}
.mini-map svg{width:100%;height:100%}
.mini-map .mm-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:5 4;stroke-linecap:round}
.mini-map .mm-dot{stroke:#fff;stroke-width:2}
.mini-map .mm-num{font-size:9px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}
.itinerary{display:flex;flex-direction:column}
.it-item{display:flex;gap:11px;padding:10px 2px;position:cursor}
.it-item .seq{width:22px;height:22px;border-radius:50%;font-size:11.5px;font-weight:700;display:grid;place-items:center;color:#fff;flex:none}
.it-item .it-meta{flex:1;min-width:0}
.it-item .it-nm{font-size:13.5px;font-weight:500}
.it-item .it-sub{font-size:11.5px;color:var(--text-2);margin-top:2px}
.it-item .it-note-text{font-size:12px;color:var(--accent);margin-top:3px}
.it-item + .it-item{border-top:1px solid var(--line)}
.rc-foot{display:flex;gap:8px;margin-top:10px}
.rc-foot .btn{height:36px;font-size:13px}

/* ========== 底部导航 ========== */
.bottom-nav{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;border-radius:28px;padding:7px;display:flex;gap:4px;background:var(--glass-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);box-shadow:var(--shadow-l)}
.nav-item{position:relative;width:120px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:500;color:var(--text-2);z-index:1;transition:color .25s var(--ease)}
.nav-item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:var(--accent)}
.nav-pill{position:absolute;top:7px;bottom:7px;width:120px;border-radius:22px;background:var(--accent-soft);transition:transform .35s var(--spring);z-index:0}

/* ========== Toast ========== */
.toast{position:absolute;top:18px;left:50%;transform:translate(-50%,-20px);background:var(--glass-bg-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);box-shadow:var(--shadow-m);border-radius:14px;padding:11px 18px;font-size:13.5px;font-weight:500;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease);max-width:80vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ========== 响应式 ========== */
@media (max-width:900px){
  .plan-grid{grid-template-columns:1fr}
  .detail-card{right:12px;left:12px;width:auto;top:auto;bottom:84px;transform:translateY(20px);max-height:62vh}
  .detail-card.open{transform:translateY(0)}
}
@media (max-width:640px){
  .sidebar{width:64px;top:68px;bottom:90px}
  .sb-btn{font-size:0;gap:0;height:52px}
  .selected-panel,.filter-panel{display:none !important}
  .sidebar.drawer-open{width:min(260px,82vw)}
  .sidebar.drawer-open .sb-btn{font-size:12px;height:46px}
  .sidebar.drawer-open .selected-panel{display:flex !important}
  .sidebar.drawer-open .filter-panel{display:block !important}
  .search-bar{width:calc(100vw - 130px)}
  .nav-item{width:104px}
  .nav-pill{width:104px}
  .plan-wrap{padding:70px 14px 100px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="app">

  <!-- ===== 视图：地图 ===== -->
  <section class="view active" id="view-map">
    <div class="map-stage" id="mapStage">

    <!-- 主题切换 -->
    <button class="fab theme-btn glass" id="themeBtn" title="切换深浅色">

        <button class="sb-btn" id="markBtn">
          <svg viewBox="0 0 24 24"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>标记

    </button>

  <div class="toast" id="toast"></div>
</div>
<script>
/* ========== 点位数据（示例数据） ========== */
const DISTRICTS=['东湖区','西湖区','红谷滩区','青云谱区','青山湖区','新建区'];
const TYPE_META={
  spot:{label:'景点',color:'var(--c-spot)'},
  food:{label:'正餐美食',color:'var(--c-food)'},
  leisure:{label:'休闲市集小店',color:'var(--c-leisure)'},
  facility:{label:'配套服务',color:'var(--c-facility)'}
};
const ICONS={
  star:'<svg viewBox="0 0 24 24"><path d="M12 3.5 14.4 9l6 .7-4.5 4.1 1.2 5.9L12 16.9l-5.1 2.8 1.2-5.9L3.6 9.7l6-.7L12 3.5Z"/></svg>',
  food:'<svg viewBox="0 0 24 24"><path d="M7 3v7M5 3v7a2 2 0 0 0 4 0V3M7 10v11M17 3c-2 1.5-2.5 4-2.5 7s.5 5 2.5 5v6"/></svg>',
  bag:'<svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  info:'<svg viewBox="0 0 24 24"><path d="M12 8h.01M11 12h1v4h1"/></svg>'
};
const POIS=[
 {id:'twg',name:'滕王阁',type:'spot',district:'东湖区',x:27,y:43,desc:'江南三大名楼之一，《滕王阁序》诞生地，登楼可俯瞰赣江两岸城市风光，夜景灯光尤为壮观。',open:'08:00 - 22:00',stay:'90分钟',ticket:'门票 ¥50'},
 {id:'qs',name:'秋水广场',type:'spot',district:'红谷滩区',x:19,y:36,desc:'赣江西岸滨江广场，拥有大型音乐喷泉，夜晚灯光秀与江景是最大看点。',open:'全天开放',stay:'60分钟'},
 {id:'bow',name:'江西省博物馆',type:'spot',district:'红谷滩区',x:14,y:27,desc:'江西最大综合性博物馆，海昏侯墓出土文物常设展是镇馆之宝。',open:'09:00 - 17:00（周一闭馆）',stay:'120分钟',ticket:'免费预约'},
 {id:'bygc',name:'八一广场',type:'spot',district:'东湖区',x:39,y:44,desc:'南昌城市中心地标，八一南昌起义纪念塔矗立于此，周边商圈密集。',open:'全天开放',stay:'40分钟'},
 {id:'qiyi',name:'八一起义纪念馆',type:'spot',district:'西湖区',x:35,y:51,desc:'全国重点文物保护单位，完整展示八一南昌起义历史的革命纪念馆。',open:'09:00 - 17:30',stay:'75分钟',ticket:'免费'},
 {id:'wsg',name:'万寿宫历史文化街区',type:'leisure',district:'西湖区',x:31,y:54,desc:'赣派建筑风格的历史街区，集非遗文创、特色小吃、夜景逛购于一体。',open:'10:00 - 22:00',stay:'90分钟'},
 {id:'sjt',name:'绳金塔',type:'spot',district:'西湖区',x:33,y:64,desc:'南昌古城镇城之宝，千年古塔周边已改造为市井美食街区。',open:'09:00 - 21:00',stay:'60分钟'},
 {id:'bygy',name:'八一公园',type:'spot',district:'东湖区',x:41,y:36,desc:'市中心老牌城市公园，湖岛亭廊俱全，是本地市民日常休闲去处。',open:'全天开放',stay:'45分钟'},
 {id:'txy',name:'天香园',type:'spot',district:'青山湖区',x:63,y:69,desc:'城市中的湿地候鸟乐园，盆景园林与白鹭栖息是特色。',open:'08:00 - 17:30',stay:'90分钟',ticket:'门票 ¥40'},
 {id:'qsh',name:'青山湖绿道',type:'spot',district:'青山湖区',x:66,y:38,desc:'环绕青山湖的滨水绿道，适合骑行、散步与环湖慢跑。',open:'全天开放',stay:'60分钟'},
 {id:'bdsr',name:'八大山人纪念馆',type:'spot',district:'青云谱区',x:55,y:82,desc:'建于青云谱道院旧址，纪念写意画大师八大山人，馆藏书画与园林俱佳。',open:'09:00 - 17:00（周一闭馆）',stay:'80分钟',ticket:'免费'},
 {id:'xpxd',name:'小平小道陈列馆',type:'spot',district:'新建区',x:8,y:72,desc:'邓小平同志曾劳动行走的小道改建而成的爱国主义教育陈列馆。',open:'09:00 - 17:00',stay:'60分钟',ticket:'免费'},
 {id:'ms1',name:'老南昌瓦罐汤馆',type:'food',district:'西湖区',x:44,y:55,desc:'本地人气老店，瓦罐煨汤配拌粉是南昌人经典早餐组合。',open:'06:30 - 20:30',stay:'40分钟',cost:'人均 ¥25 - 40'},
 {id:'ms2',name:'赣菜馆·藜蒿炒腊肉',type:'food',district:'东湖区',x:47,y:40,desc:'主打赣菜正餐，藜蒿炒腊肉、啤酒鸭、三杯鸡等招牌菜齐全。',open:'10:30 - 21:30',stay:'70分钟',cost:'人均 ¥60 - 90'},
 {id:'wc1',name:'公共卫生间',type:'facility',district:'东湖区',x:48,y:48,desc:'市政公共卫生间，干净整洁，全天开放。',open:'全天开放'},
 {id:'dt1',name:'地铁滕王阁站',type:'facility',district:'东湖区',x:24,y:49,desc:'地铁1号线站点，B口出站步行约800米可达滕王阁。',open:'06:00 - 23:00'}
];
const getPoi=id=>POIS.find(p=>p.id===id);

/* ========== 状态 ========== */
const state={
  view:'map',markMode:false,filterOpen:false,listFilter:'all',genMode:'smart',detailId:null,
  districts:new Set(DISTRICTS),types:new Set(Object.keys(TYPE_META)),
  selected:['twg','wsg','ms1'],visited:new Set(),routes:[]
};

/* ========== 工具函数 ========== */
function $(s){return document.querySelector(s)}
function parseStay(s){const m=/(\d+)\s*分钟/.exec(s||'');return m?+m[1]:0}
function fmtDur(mins){const h=Math.floor(mins/60),m=mins%60;return h?`${h}小时${m?m+'分钟':''}`:`${m}分钟`}
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}

/* ========== 筛选复选框 ========== */
function renderFilters(){
  $('#districtFilters').innerHTML=DISTRICTS.map(d=>`
    <label class="chk ${state.districts.has(d)?'on':''}" data-district="${d}">
      <span class="box"><svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg></span>${d}
    </label>`).join('');
  $('#typeFilters').innerHTML=Object.entries(TYPE_META).map(([k,v])=>`
    <label class="chk ${state.types.has(k)?'on':''}" data-type="${k}">
      <span class="box"><svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg></span>${v.label}
    </label>`).join('');
}
$('#districtFilters').addEventListener('click',e=>{
  const el=e.target.closest('[data-district]');if(!el)return;
  const d=el.dataset.district;state.districts.has(d)?state.districts.delete(d):state.districts.add(d);
  renderFilters();renderMarkers();
});
$('#typeFilters').addEventListener('click',e=>{
  const el=e.target.closest('[data-type]');if(!el)return;
  const t=el.dataset.type;state.types.has(t)?state.types.delete(t):state.types.add(t);
  renderFilters();renderMarkers();
});

/* ========== Marker 渲染 ========== */
function markerVisible(p){
  if(state.markMode&&!state.selected.includes(p.id))return false;
  if(!state.districts.has(p.district))return false;
  if(!state.types.has(p.type))return false;
  return true;
}
function markerIcon(p){
  if(p.type==='spot')return ICONS.star;
  if(p.type==='food')return ICONS.food;
  if(p.type==='leisure')return ICONS.bag;
  return ICONS.info;
}
function renderMarkers(){
  $('#markersLayer').innerHTML=POIS.map(p=>`
    <div class="marker ${p.type} ${state.visited.has(p.id)?'visited':''} ${markerVisible(p)?'':'hidden-marker'}"
      data-id="${p.id}" data-name="${p.name}" style="left:${p.x}%;top:${p.y}%;--pin-color:${TYPE_META[p.type].color}">
      <div class="pin">${markerIcon(p)}</div>
    </div>`).join('');
}
$('#markersLayer').addEventListener('click',e=>{
  const el=e.target.closest('.marker');if(!el)return;
  openDetail(el.dataset.id);
});
$('#markersLayer').addEventListener('mouseover',e=>{const m=e.target.closest('.marker');if(m)m.classList.add('tip-label')});
$('#markersLayer').addEventListener('mouseout',e=>{const m=e.target.closest('.marker');if(m)m.classList.remove('tip-label')});

/* ========== 点位详情 ========== */
function openDetail(id){
  const p=getPoi(id);state.detailId=id;
  $('#dcName').textContent=p.name;
  $('#dcSub').innerHTML=`<span class="tag">${TYPE_META[p.type].label}</span><span>|</span><span>${p.district}</span>`;
  $('#dcDesc').textContent=p.desc;
  const rows=[`<div class="dc-row"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="k">开放时间</span><span class="v">${p.open}</span></div>`];
  if(p.type!=='facility')rows.push(`<div class="dc-row"><svg viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/><path d="M12 8v4l3 2"/></svg><span class="k">停留时长</span><span class="v">约 ${p.stay}</span></div>`);
  if(p.ticket)rows.push(`<div class="dc-row"><svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z"/><path d="M12 6v12"/></svg><span class="k">门票</span><span class="v">${p.ticket}</span></div>`);
  if(p.cost)rows.push(`<div class="dc-row"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H7"/></svg><span class="k">消费参考</span><span class="v">${p.cost}</span></div>`);
  $('#dcInfo').innerHTML=rows.join('');
  $('#dcNote').value=p.note||'';
  const addBtn=$('#addBtn');
  if(p.type==='facility'){addBtn.style.display='none'}
  else{
    addBtn.style.display='flex';
    const added=state.selected.includes(id);
    addBtn.disabled=added;
    addBtn.innerHTML=added?'<svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>已添加':'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>添加到路线';
  }
  $('#detailCard').classList.add('open');
}
$('#dcNote').addEventListener('input',e=>{if(state.detailId)getPoi(state.detailId).note=e.target.value});
$('#addBtn').addEventListener('click',()=>{
  const id=state.detailId;if(!id||state.selected.includes(id))return;
  state.selected.push(id);
  const n=state.selected.length;
  if(n===15||(n>15&&(n-15)%5===0))toast(`已选择 ${n} 个点位，数量较多，可能影响单日游览体验`);
  else toast(`已添加「${getPoi(id).name}」`);
  afterSelectionChange();openDetail(id);
});
$('#nearbyBtn').addEventListener('click',()=>{
  const p=getPoi(state.detailId);
  const near=POIS.filter(o=>o.id!==p.id&&Math.hypot(o.x-p.x,o.y-p.y)<13);
  toast(near.length?`周边 500 米内有 ${near.length} 个点位：${near.slice(0,3).map(o=>o.name).join('、')}${near.length>3?' 等':''}`:'周边 500 米内暂无收录点位');
});
function closeDetail(){$('#detailCard').classList.remove('open');state.detailId=null}

/* ========== 侧边栏按钮 ========== */
$('#filterBtn').addEventListener('click',()=>{
  state.filterOpen=!state.filterOpen;
  $('#filterPanel').classList.toggle('open',state.filterOpen);
  $('#filterBtn').classList.toggle('on',state.filterOpen);
  if(window.innerWidth<=640)$('#sidebar').classList.toggle('drawer-open',state.filterOpen);
});
$('#markBtn').addEventListener('click',()=>{
  state.markMode=!state.markMode;
  $('#markBtn').classList.toggle('on',state.markMode);
  if(window.innerWidth<=640)$('#sidebar').classList.add('drawer-open');
  renderMarkers();
  toast(state.markMode?'已切换为仅显示待选点位':'已退出标记模式');
});
$('#mapStage').addEventListener('click',e=>{
  if(window.innerWidth<=640&&!e.target.closest('.sidebar'))$('#sidebar').classList.remove('drawer-open');
  if(!e.target.closest('.marker'))closeDetail();
});

/* ========== 待选清单 ========== */
function spItemHtml(id,seq){
  const p=getPoi(id);
  return `<div class="sp-item" draggable="true" data-id="${id}">
    <span class="dot" style="background:${TYPE_META[p.type].color}"></span>
    <div class="meta"><div class="nm">${p.name}</div><div class="ty">${TYPE_META[p.type].label} · ${p.district}</div></div>
    ${p.note?'<svg class="note-ico" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"/></svg>':''}
    <button class="del" data-del="${id}"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l18 18"/></svg></button>
  </div>`;
}
function renderSelectedLists(){
  const ids=state.selected.filter(id=>state.listFilter==='all'||getPoi(id).type===state.listFilter);
  $('#spCount').textContent=`已选择：${state.selected.length} 个`;
  $('#planCount').textContent=`${state.selected.length} 个`;
  $('#spList').innerHTML=state.selected.length
    ? (ids.length?ids.map(spItemHtml).join(''):'<div class="sp-empty">该类型下暂无点位</div>')
    : '<div class="sp-empty">还没有选择点位<br>点击地图上的点位添加</div>';
  $('#planList').innerHTML=state.selected.length
    ? state.selected.map(spItemHtml).join('')
    : '<div class="sp-empty">暂无点位，请先在地图页挑选</div>';
  document.querySelectorAll('#spTools .mini-chip').forEach(b=>b.classList.toggle('on',b.dataset.filter===state.listFilter));
}
$('#spTools').addEventListener('click',e=>{const b=e.target.closest('.mini-chip');if(b){state.listFilter=b.dataset.filter;renderSelectedLists()}});
function removePoint(id){
  state.selected=state.selected.filter(x=>x!==id);
  if(state.detailId===id)closeDetail();
  afterSelectionChange();
}
document.addEventListener('click',e=>{
  const d=e.target.closest('[data-del]');if(d){e.stopPropagation();removePoint(d.dataset.del);return}
  const item=e.target.closest('.sp-item');
  if(item&&!e.target.closest('button')){
    const id=item.dataset.id;
    if(state.view!=='map')switchView('map');
    setTimeout(()=>{openDetail(id);flashMarker(id)},state.view!=='map'?320:0);
  }
});
$('#clearBtn').addEventListener('click',()=>{
  if(!state.selected.length){toast('清单已经是空的');return}
  state.selected=[];closeDetail();afterSelectionChange();toast('已清空全部待选点位');
});
function flashMarker(id){
  const m=document.querySelector(`.marker[data-id="${id}"]`);
  if(!m)return;
  m.classList.add('flash');setTimeout(()=>m.classList.remove('flash'),1200);
}
/* 拖拽排序 */
let dragId=null;
$('#spList').addEventListener('dragstart',e=>{const it=e.target.closest('.sp-item');if(!it)return;dragId=it.dataset.id;it.classList.add('dragging')});
$('#spList').addEventListener('dragend',e=>{const it=e.target.closest('.sp-item');if(it)it.classList.remove('dragging')});
$('#spList').addEventListener('dragover',e=>{
  e.preventDefault();
  const after=getDragAfter($('#spList'),e.clientY);
  const ids=state.selected;
  const from=ids.indexOf(dragId);ids.splice(from,1);
  const to=after?ids.indexOf(after):ids.length;ids.splice(to,0,dragId);
  renderSelectedLists();
});
function getDragAfter(container,y){
  const els=[...container.querySelectorAll('.sp-item:not(.dragging)')];
  return els.reduce((best,el)=>{const r=el.getBoundingClientRect();const off=y-r.top-r.height/2;return(off<0&&off>best.offset)?{offset:off,id:el.dataset.id}:best},{offset:-Infinity}).id;
}
function afterSelectionChange(){renderMarkers();renderSelectedLists();saveLocal()}

/* ========== 路线生成 ========== */
function nearestNeighbor(ids){
  const rest=[...ids],order=[rest.shift()];
  while(rest.length){
    const cur=getPoi(order[order.length-1]);let bi=0,bd=Infinity;
    rest.forEach((id,i)=>{const p=getPoi(id);const d=(p.x-cur.x)**2+(p.y-cur.y)**2;if(d<bd){bd=d;bi=i}});
    order.push(rest.splice(bi,1)[0]);
  }
  return order;
}
$('#modeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  state.genMode=b.dataset.mode;
  document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x===b));
});
$('#generateBtn').addEventListener('click',()=>{
  if(!state.selected.length){toast('请先在地图页添加点位');return}
  const points=state.genMode==='smart'?nearestNeighbor(state.selected):[...state.selected];
  state.routes.push({id:'r'+Date.now(),name:`路线${state.routes.length+1}`,mode:state.genMode,points});
  renderRoutes();toast('路线生成成功，可在下方查看');
});
function routeDuration(route){
  const stay=route.points.reduce((a,id)=>a+parseStay(getPoi(id).stay),0);
  return fmtDur(stay+Math.max(0,route.points.length-1)*15);
}
function renderRoutes(){
  $('#routeCards').innerHTML=state.routes.map((r,ri)=>`
  <div class="route-card glass" data-rid="${r.id}">
    <div class="rc-head">
      <div class="rc-order">${ri+1}</div>
      <div class="rc-meta">
        <div class="rc-name"><input value="${r.name}" data-rname="${r.id}" aria-label="路线命名"></div>
        <div class="rc-count">${r.points.length} 个点位 · ${r.mode==='smart'?'顺路最优':'清单顺序'}</div>
      </div>
      <button class="rc-icon-btn" data-rcopy="${r.id}" title="复制路线"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
      <button class="rc-icon-btn" data-rdel="${r.id}" title="删除路线"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13h8l1-13"/></svg></button>
      <span class="rc-icon-btn rc-chevron"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>
    </div>
    <div class="rc-body">
      <div class="rc-summary">
        <span class="chip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>预估 ${routeDuration(r)}</span>
        <span class="chip"><svg viewBox="0 0 24 24"><path d="M5 17a3 3 0 1 0 0-6 7 7 0 0 1 14 0 3 3 0 1 0 0 6H5Z"/></svg>默认驾车估算</span>
      </div>
      <div class="mini-map">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none">
          <rect width="100" height="100" fill="var(--map-bg)"/>
          <path d="M30 -5 C25 20 35 35 27 52 C21 66 30 82 25 105" fill="none" stroke="var(--map-water)" stroke-width="8"/>
          <path d="M-5 25 L105 28M-5 57 L105 54M17 -5 L20 105M47 -5 L43 105M73 -5 L77 105" fill="none" stroke="var(--map-road)" stroke-width="1.6"/>
          <polyline class="mm-line" points="${r.points.map(id=>{const p=getPoi(id);return `${p.x},${p.y}`}).join(' ')}"/>
          ${r.points.map((id,i)=>{const p=getPoi(id);return `<circle class="mm-dot" cx="${p.x}" cy="${p.y}" r="3.4" fill="${TYPE_META[p.type].color}"/><text class="mm-num" x="${p.x}" y="${p.y+0.2}">${i+1}</text>`}).join('')}
        </svg>
      </div>
      <div class="itinerary">
        ${r.points.map((id,i)=>{const p=getPoi(id);return `
        <div class="it-item">
          <span class="seq" style="background:${TYPE_META[p.type].color}">${i+1}</span>
          <div class="it-meta">
            <div class="it-nm">${p.name}</div>
            <div class="it-sub">${TYPE_META[p.type].label} · ${p.type==='facility'?p.open:'停留约 '+p.stay+' · '+p.open}</div>
            ${p.note?`<div class="it-note-text">备注：${p.note}</div>`:''}
          </div>
        </div>`}).join('')}
      </div>
      <div class="rc-foot">
        <button class="btn btn-ghost" data-export="${r.id}"><svg viewBox="0 0 24 24"><rect x="8" y="3" width="12" height="18" rx="2"/><path d="M16 3v18M4 8h4M4 12h4M4 16h4"/></svg>复制行程</button>
      </div>
    </div>
  </div>`).join('');
}
$('#routeCards').addEventListener('click',e=>{
  const head=e.target.closest('.rc-head');
  if(head&&!e.target.closest('input,button'))head.parentElement.classList.toggle('open');
  const del=e.target.closest('[data-rdel]');
  if(del){const id=del.dataset.rdel;state.routes=state.routes.filter(r=>r.id!==id);renderRoutes();toast('路线已删除');return}
  const cp=e.target.closest('[data-rcopy]');
  if(cp){const src=state.routes.find(r=>r.id===cp.dataset.rcopy);
    state.routes.push({...src,id:'r'+Date.now(),name:src.name+' 副本',points:[...src.points]});
    renderRoutes();toast('已复制路线副本');return}
  const ex=e.target.closest('[data-export]');
  if(ex){const r=state.routes.find(x=>x.id===ex.dataset.export);
    const text=`【${r.name}】预估总时长 ${routeDuration(r)}\n`+r.points.map((id,i)=>{const p=getPoi(id);return `${i+1}. ${p.name}（${TYPE_META[p.type].label}，停留约${p.stay||'—'}）${p.note?' 备注：'+p.note:''}`}).join('\n');
    navigator.clipboard?.writeText(text).then(()=>toast('行程文本已复制到剪贴板')).catch(()=>toast('浏览器拒绝了剪贴板访问'));
  }
});
$('#routeCards').addEventListener('change',e=>{
  const inp=e.target.closest('[data-rname]');if(inp){state.routes.find(r=>r.id===inp.dataset.rname).name=inp.value}
});

/* ========== 底部导航 ========== */
function switchView(v){
  state.view=v;
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('active',s.id==='view-'+v));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===v));
  $('#navPill').style.transform=v==='plan'?'translateX(100%)':'translateX(0)';
}
document.querySelectorAll('.nav-item').forEach(n=>n.addEventListener('click',()=>switchView(n.dataset.view)));

/* ========== 搜索 ========== */
$('#searchInput').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const kw=e.target.value.trim();if(!kw)return;
  const p=POIS.find(o=>o.name.includes(kw));
  if(!p){toast(`未找到与「${kw}」相关的点位`);return}
  if(!markerVisible(p)){toast('该点位在当前筛选条件下被隐藏，请调整筛选');return}
  openDetail(p.id);flashMarker(p.id);toast(`已定位到「${p.name}」`);
});

/* ========== 主题切换 ========== */
$('#themeBtn').addEventListener('click',()=>{
  const dark=document.documentElement.dataset.theme==='dark';
  document.documentElement.dataset.theme=dark?'light':'dark';
  $('#themeIcon').innerHTML=dark
    ?'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>'
    :'<circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M4.2 4.2 6 6m12 12 1.8 1.8M1.5 12H4m20 0h-2.5M4.2 19.8 6 18M18 6l1.8-1.8"/>';
  toast(dark?'已切换为浅色模式':'已切换为深色模式');
});

/* ========== 复位 ========== */
$('#resetBtn').addEventListener('click',()=>{
  const s=$('#mapStage');s.style.transition='transform .5s var(--ease)';s.style.transform='scale(.96)';
  setTimeout(()=>{s.style.transform='scale(1)';setTimeout(()=>s.style.transition='',500)},180);
  toast('视角已复位至南昌全域');
});

/* ========== 本地记忆 ========== */
function saveLocal(){try{localStorage.setItem('nanchang_preview',JSON.stringify({selected:state.selected,genMode:state.genMode}))}catch(e){}}
try{
  const saved=JSON.parse(localStorage.getItem('nanchang_preview')||'null');
  if(saved&&Array.isArray(saved.selected))state.selected=saved.selected.filter(id=>getPoi(id));
}catch(e){}

/* ========== 初始化 ========== */
state.routes.push({id:'r-demo',name:'路线1',mode:'smart',points:nearestNeighbor(state.selected)});
renderFilters();renderMarkers();renderSelectedLists();renderRoutes();
</script>
</body>
</html>
